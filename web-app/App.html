<script>
(function () {
  'use strict';

  /* ---------- State and server calls ---------- */

  var S = { token: null, user: null, boot: null };
  try { S.token = sessionStorage.getItem('swc_token'); } catch (e) {}

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        var msg = (err && err.message) || String(err);
        if (msg.indexOf('SESSION_EXPIRED') >= 0) { signedOut('Please sign in again.'); return; }
        reject(new Error(msg));
      });
      runner[fn].apply(runner, args);
    });
  }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var seq = routeSeq;
    return call.apply(null, [fn, S.token].concat(args)).then(function (r) {
      // A slow answer for a screen the person has already left is dropped.
      if (seq !== routeSeq) return new Promise(function () {});
      return r;
    });
  }

  /* ---------- Small helpers ---------- */

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  function esc(v) {
    return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function d(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : iso; }
  function rs(n) { return '₹ ' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function num(n) { return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function nights(a, b) {
    if (!a || !b) return null;
    var n = Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
    return isFinite(n) ? n : null;
  }
  function stayText(n) { n = Number(n); return n <= 0 ? 'Day visit' : n === 1 ? '1 night' : n + ' nights'; }
  function badge(status) {
    var cls = { 'To review': 'b-review', 'Approved': 'b-approved', 'Not approved': 'b-no', 'Left': 'b-left',
      'Open': 'b-open', 'Meeting set': 'b-meeting', 'Resolved': 'b-resolved', 'Closed': 'b-closed' }[status] || '';
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }
  function isCommittee() { return S.user && S.user.role !== 'staff'; }
  function isAdmin() { return S.user && S.user.role === 'admin'; }
  function today() { return S.boot ? S.boot.today : new Date().toISOString().slice(0, 10); }
  function formData(form) {
    var o = {};
    $$('input, select, textarea', form).forEach(function (el) {
      if (!el.name) return;
      if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
      else if (el.type === 'checkbox') { o[el.name] = el.checked; }
      else if (el.type !== 'file') { o[el.name] = el.value; }
    });
    return o;
  }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast hidden'; }, isErr ? 6000 : 3500);
  }
  function fail(err) { toast(err.message || String(err), true); }
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Saving…'; btn.disabled = true; }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
  }

  var dlg = $('#dlg');
  function openDialog(html, wire) {
    $('#dlgBody').innerHTML = html;
    if (wire) wire($('#dlgBody'));
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeDialog() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeDialog(); });

  /* Photos: shrink on the device before sending, so uploads stay small on school Wi-Fi. */
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read the photo.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('That file is not a photo.')); };
        img.onload = function () {
          var max = 1600, w = img.width, h = img.height;
          if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // Logos are kept small (160 px, PNG so a transparent background stays transparent).
  function logoImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read the picture.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('That file is not a picture.')); };
        img.onload = function () {
          var max = 160, r = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL('image/png');
          if (url.length > 44000) url = c.toDataURL('image/jpeg', 0.85);
          resolve(url);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function showPhotos(ids, title) {
    openDialog('<h2>' + esc(title) + '</h2><div class="gallery" id="gal"><div class="loading">Loading photos…</div></div>' +
      '<div class="actions"><button class="btn" type="button" data-close>Close</button></div>', function (root) {
      $('[data-close]', root).onclick = closeDialog;
      Promise.all(ids.map(function (id) { return api('getPhoto', id); })).then(function (urls) {
        $('#gal').innerHTML = urls.map(function (u, i) { return '<img alt="Photo ' + (i + 1) + '" src="' + esc(u) + '">'; }).join('');
      }).catch(fail);
    });
  }

  /* ---------- Shell ---------- */

  function navItems() {
    if (!isCommittee()) return [['home', 'Home'], ['visitor-new', 'Report a visitor'], ['dispute-new', 'Report a dispute'], ['mine', 'My reports'], ['pin', 'Change PIN']];
    var items = [['home', 'Dashboard'], ['visitors', 'Visitor reports'], ['disputes', 'Disputes'], ['funds', 'Party funds'], ['reports', 'Print reports'], ['mine', 'My reports']];
    if (isAdmin()) items.push(['staff', 'Staff and settings']);
    items.push(['pin', 'Change PIN']);
    return items;
  }
  function shell() {
    $('#app').innerHTML = '<div class="layout"><nav class="side" aria-label="Main" id="nav"></nav><main id="view"></main></div>';
    $('#nav').innerHTML = navItems().map(function (n) { return '<a href="#' + n[0] + '" data-route="' + n[0] + '">' + esc(n[1]) + '</a>'; }).join('') +
      '<div class="nav-foot" style="flex:1"></div><div class="nav-foot small muted" style="padding:10px 12px">' + (isCommittee() ? 'Committee view' : 'Staff view') +
      '<div class="credit-side">' + esc(CREDIT) + '</div></div>';
    $('#who').classList.remove('hidden');
    $('#whoName').textContent = S.user.name;
    $('#whoDate').textContent = d(today());
  }
  function setActive(route) {
    $$('#nav a').forEach(function (a) { a.classList.toggle('active', a.dataset.route === route); });
  }
  function view(html) {
    var v = $('#view');
    if (!v) return document.createElement('div');
    v.innerHTML = html; window.scrollTo(0, 0); return v;
  }
  function loading() { view('<div class="loading">Loading…</div>'); }

  function signedOut(msg) {
    S.token = null; S.user = null;
    try { sessionStorage.removeItem('swc_token'); } catch (e) {}
    $('#who').classList.add('hidden');
    showLogin(msg);
  }
  $('#logoutBtn').onclick = function () { if (S.token) call('logout', S.token); signedOut(); };

  /* Committee name, school name and logo, set by the admin in Settings. */
  var CREDIT = 'Developed by Tenzing Tsewang, TCV Selakui Librarian';
  var BRAND = { committeeName: 'Staff Welfare Committee', schoolName: 'TCV School Selakui', logo: '' };
  function sealHtml(cls) {
    return BRAND.logo ? '<img class="' + cls + ' logo" alt="" src="' + esc(BRAND.logo) + '">' : '<div class="' + cls + '" aria-hidden="true">SWC</div>';
  }
  function applyBrand(b) {
    if (b) BRAND = b;
    $('#brandTitle').textContent = BRAND.committeeName;
    $('#brandSchool').textContent = BRAND.schoolName;
    var seal = $('#seal');
    seal.innerHTML = BRAND.logo ? '<img alt="" src="' + esc(BRAND.logo) + '">' : 'SWC';
    seal.classList.toggle('has-logo', !!BRAND.logo);
    document.title = BRAND.committeeName;
  }

  function showLogin(msg) {
    $('#app').innerHTML = '<div class="login-wrap"><form class="login" id="loginForm" novalidate>' +
      '<div class="login-head">' + sealHtml('login-seal') +
      '<div><div class="login-title">' + esc(BRAND.committeeName) + '</div><div class="muted">' + esc(BRAND.schoolName) + '</div></div></div>' +
      '<h1>Sign in</h1><p class="muted" style="margin:0">Use the staff ID and PIN the committee gave you.</p>' +
      (msg ? '<div class="warn">' + esc(msg) + '</div>' : '') +
      '<div class="field"><label for="lid">Staff ID</label><input type="text" id="lid" name="id" autocomplete="username" autocapitalize="none" required></div>' +
      '<div class="field"><label for="lpin">PIN</label><input type="password" id="lpin" name="pin" inputmode="numeric" autocomplete="current-password" required></div>' +
      '<div class="pinpad" aria-label="Number pad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'].map(function (k) {
        var label = k === 'clear' ? 'Clear' : k === 'back' ? '⌫' : k;
        return '<button type="button" data-k="' + k + '"' + (k === 'back' ? ' aria-label="Delete last digit"' : '') + (k === 'clear' ? ' class="fn"' : k === 'back' ? ' class="fn"' : '') + '>' + label + '</button>';
      }).join('') + '</div>' +
      '<button class="btn primary login-go" type="submit">Sign in</button>' +
      '<div class="credit">' + esc(CREDIT) + '</div></form></div>';
    $('#lid').focus();
    $$('.pinpad button').forEach(function (b) {
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });
      b.onclick = function () {
        var k = b.dataset.k, el = $('#lpin');
        if (k === 'clear') el.value = ''; else if (k === 'back') el.value = el.value.slice(0, -1); else if (el.value.length < 8) el.value += k;
        el.focus();
      };
    });
    $('#lid').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#lpin').focus(); } };
    $('#loginForm').onsubmit = function (e) {
      e.preventDefault();
      if (!$('#lid').value.trim() || !$('#lpin').value) return fail(new Error('Type your staff ID and PIN.'));
      var btn = $('button[type=submit]', e.target); busy(btn, true, 'Signing in…');
      call('login', $('#lid').value, $('#lpin').value).then(function (r) {
        S.token = r.token;
        try { sessionStorage.setItem('swc_token', r.token); } catch (err) {}
        if (location.hash && location.hash !== '#home') history.replaceState(null, '', location.pathname + location.search + '#home');
        start();
      }).catch(function (err) { busy(btn, false); $('#lpin').value = ''; fail(err); });
    };
  }

  function start() {
    $('#app').innerHTML = '<div class="login-wrap"><div class="loading">Loading…</div></div>';
    api('bootstrap').then(function (b) {
      S.boot = b; S.user = b.user;
      applyBrand(b.branding);
      shell();
      if (S.user.mustChange) { location.hash = '#pin'; route(); toast('Please choose your own PIN first.'); return; }
      route();
    }).catch(fail);
  }

  /* ---------- Router ---------- */

  var routes = {};
  var routeSeq = 0;
  function route() {
    if (!S.user) return;
    var h = (location.hash || '#home').slice(1).split('/');
    var name = h[0] || 'home';
    if (S.user.mustChange && name !== 'pin') { location.hash = '#pin'; return; }
    var fn = routes[name] || routes.home;
    routeSeq++;
    setActive(name);
    fn(h[1], h[2]);
  }
  window.addEventListener('hashchange', route);
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = '#' + h; }

  /* ---------- Home ---------- */

  routes.home = function () {
    if (!isCommittee()) return staffHome();
    loading();
    Promise.all([api('dashboard'), desktopInfo()]).then(function (r) {
      var x = r[0], desk = r[1];
      var ev = x.nextEvent;
      var hour = new Date().getHours();
      var hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      var v = view('<div class="dash-head"><div><h1>' + hello + ', ' + esc(S.user.name.split(' ')[0]) + '</h1>' +
        '<div class="muted">' + longDate(today()) + '</div></div>' +
        '<div class="actions"><a class="btn primary" href="#visitor-new">+ Report a visitor</a>' +
        '<a class="btn" href="#dispute-new">Report a dispute</a><a class="btn" href="#funds">Donation or expense</a></div></div>' +
        backupBanner(desk) +
        '<div class="tiles">' +
        tileLink('#visitors/staying', 'Visitors staying now', x.stayingCount, x.stayingQuarters ? 'in ' + x.stayingQuarters + (x.stayingQuarters === 1 ? ' quarter' : ' quarters') : 'Nobody staying', 'teal') +
        tileLink('#visitors/review', 'Reports to review', x.toReview, x.toReview ? 'Waiting for the committee' : 'All reviewed', x.toReview ? 'warning' : 'teal') +
        tileLink('#disputes', 'Open disputes', x.openDisputes, x.nextMeeting ? 'Next meeting ' + d(x.nextMeeting) : 'No meeting set', x.openDisputes ? 'danger' : 'teal') +
        tileLink('#funds', 'Party fund balance', rs(x.balance), x.openEvents + (x.openEvents === 1 ? ' open event' : ' open events'), x.balance < 0 ? 'danger' : 'success') +
        '</div>' +
        '<div class="dash-grid"><div class="stack">' +
        (x.overdue.length ? '<section class="card attention"><div class="card-head"><h2>Should have left</h2><span class="badge b-no">' + x.overdue.length + '</span></div>' +
          '<div class="small muted">Their leaving date has passed. Mark them as left, or change the dates.</div>' +
          x.overdue.map(function (o) {
            return '<div class="line"><div><strong class="mono">' + esc(o.quarter) + '</strong> · ' + esc(o.visitorNames) + ' <span class="muted">(' + esc(o.staffName) + ')</span>' +
              '<div class="small muted">Was leaving ' + d(o.leaving) + ' · ' + daysAgo(o.leaving) + '</div></div>' +
              '<div class="actions"><button class="btn sm" type="button" data-left="' + esc(o.id) + '">Mark left</button><button class="btn sm ghost" type="button" data-visitor="' + esc(o.id) + '">Open</button></div></div>';
          }).join('') + '</section>' : '') +
        '<section class="card"><div class="card-head"><h2>Staying now</h2><a href="#visitors/staying" class="small strong-link">See all</a></div>' +
        (x.staying.length ? '<div class="table-wrap"><table><thead><tr><th>Quarter</th><th>Staff</th><th>Visitors</th><th>Leaving</th><th>Status</th></tr></thead><tbody>' +
          x.staying.map(function (o) {
            return '<tr class="click" tabindex="0" data-visitor="' + esc(o.id) + '"><td class="mono">' + esc(o.quarter) + '</td><td>' + esc(o.staffName) + '</td>' +
              '<td>' + esc(o.visitorNames) + ' <span class="muted">(' + esc(o.count) + ')</span></td><td class="nw">' + d(o.leaving) + '</td><td>' + badge(o.status) + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="empty">Nobody is staying in the quarters today.</div>') + '</section>' +
        (x.arriving.length ? '<section class="card"><h2>Coming soon</h2>' + x.arriving.map(function (o) {
          return '<div class="line click" tabindex="0" data-visitor="' + esc(o.id) + '"><div><strong class="mono">' + esc(o.quarter) + '</strong> · ' + esc(o.visitorNames) +
            ' <span class="muted">(' + esc(o.staffName) + ')</span></div><div class="small muted">Arriving ' + d(o.arrival) + '</div></div>';
        }).join('') + '</section>' : '') +
        '<section class="card"><div class="card-head"><h2>Latest visitor reports</h2><a href="#visitors/all" class="small strong-link">See all</a></div>' +
        visitorTable(x.recentVisitors, false) + '</section>' +
        '</div><div class="stack">' +
        '<section class="card"><div class="card-head"><h2>Next event</h2>' + (ev ? '<a href="#event/' + esc(ev.id) + '" class="small strong-link">Open</a>' : '') + '</div>' +
        (ev ? '<div><div style="font-weight:600;font-size:16px">' + esc(ev.name) + '</div><div class="small muted">' + longDate(ev.date) + ' · ' + daysUntil(ev.date) + '</div></div>' +
          '<dl class="facts"><dt>Collected</dt><dd class="mono">' + rs(ev.collected) + '</dd><dt>Spent</dt><dd class="mono">' + rs(ev.spent) + '</dd>' +
          '<dt>Balance</dt><dd class="mono" style="font-weight:600;color:var(--' + (ev.balance < 0 ? 'danger' : 'success') + ')">' + rs(ev.balance) + '</dd></dl>' +
          '<div class="bar" aria-hidden="true"><div style="width:' + (ev.collected > 0 ? Math.min(100, Math.round(ev.spent / ev.collected * 100)) : 0) + '%"></div></div>'
          : '<div class="empty">No upcoming event. <a href="#funds">Create one</a>.</div>') + '</section>' +
        '<section class="card"><div class="card-head"><h2>Dispute meetings</h2><a href="#disputes" class="small strong-link">All cases</a></div>' +
        (x.meetings.length ? x.meetings.map(function (c) {
          return '<a class="line click" href="#dispute/' + esc(c.id) + '"><div><span class="mono">Case ' + esc(c.caseNo) + '</span> · ' + esc(c.kind) + '</div>' +
            '<div class="small muted">' + longDate(c.meetingDate) + '</div></a>';
        }).join('') : '<div class="empty">' + (x.openDisputes ? x.openDisputes + ' open ' + (x.openDisputes === 1 ? 'case' : 'cases') + ', no meeting date set.' : 'No open disputes.') + '</div>') + '</section>' +
        '<section class="card"><div class="card-head"><h2>Latest money entries</h2><a href="#reports/money" class="small strong-link">Statement</a></div>' +
        (x.recentMoney.length ? x.recentMoney.map(function (m) {
          var inflow = m.kind === 'donation';
          return '<a class="line click" href="#event/' + esc(m.eventId) + '"><div><div>' + esc(m.what) + '</div><div class="small muted">' + d(m.date) + (m.event ? ' · ' + esc(m.event) : '') + '</div></div>' +
            '<div class="mono" style="font-weight:600;white-space:nowrap;color:var(--' + (inflow ? 'success' : 'ink') + ')">' + (inflow ? '+ ' : '− ') + rs(m.amount) + '</div></a>';
        }).join('') : '<div class="empty">No donations or expenses yet.</div>') + '</section>' +
        (desk ? '<section class="card"><h2>Backups</h2><div class="small">' + backupText(desk) + '</div>' +
          (isAdmin() ? '<div class="actions"><button class="btn sm" type="button" data-backup>Back up now</button></div>' : '') + '</section>' : '') +
        '</div></div>');
      wireVisitorRows();
      $$('[data-left]', v).forEach(function (b) {
        b.onclick = function () {
          busy(b, true, '…');
          api('setVisitorStatus', b.dataset.left, 'Left', '').then(function () { toast('Marked as left.'); route(); }).catch(function (e) { busy(b, false); fail(e); });
        };
      });
      wireBackupButtons(v);
    }).catch(fail);
  };
  function tileLink(href, label, n, sub, tone) {
    return '<a class="tile tone-' + tone + '" href="' + href + '"><div class="label">' + esc(label) + '</div><div class="num">' + esc(n) +
      '</div><div class="small muted">' + esc(sub) + '</div></a>';
  }
  function longDate(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0, 10).split('-');
    var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return dt.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function dayDiff(iso) { return Math.round((new Date(iso + 'T00:00:00Z') - new Date(today() + 'T00:00:00Z')) / 86400000); }
  function daysAgo(iso) { var n = -dayDiff(iso); return n === 1 ? '1 day ago' : n + ' days ago'; }
  function daysUntil(iso) { var n = dayDiff(iso); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }

  /* ---------- Desktop app extras (backups, PDF, updates). Hidden in the Google version. ---------- */

  var DESKTOP = !!window.swcDesktop && !!window.swcDesktop.info;
  function desktopInfo() { return DESKTOP ? window.swcDesktop.info().catch(function () { return null; }) : Promise.resolve(null); }
  function backupAge(desk) { return desk && desk.lastBackup ? Math.floor((Date.now() - new Date(desk.lastBackup).getTime()) / 86400000) : null; }
  function backupText(desk) {
    var age = backupAge(desk);
    var last = age === null ? 'No USB backup has been made yet.' : 'Last backup: ' + (age === 0 ? 'today' : age === 1 ? 'yesterday' : age + ' days ago') + '.';
    return last + ' The app also keeps a daily copy on this PC.';
  }
  function backupBanner(desk) {
    if (!desk || !isAdmin()) return '';
    var age = backupAge(desk);
    if (age !== null && age < 7) return '';
    return '<div class="banner"><div><strong>' + (age === null ? 'No backup on a USB drive yet.' : 'No backup for ' + age + ' days.') + '</strong> ' +
      'If this PC breaks, records that are not backed up are lost. Plug in a USB drive and back up now.</div>' +
      '<button class="btn primary sm" type="button" data-backup>Back up now</button></div>';
  }
  function wireBackupButtons(root) {
    $$('[data-backup]', root).forEach(function (b) {
      b.onclick = function () { window.swcDesktop.action('backup').then(function (ok) { if (ok) route(); }); };
    });
  }

  function tile(label, n, sub, color) {
    return '<div class="tile"><div class="label">' + esc(label) + '</div><div class="num"' + (color ? ' style="color:' + color + '"' : '') + '>' + esc(n) +
      '</div><div class="small muted">' + esc(sub) + '</div></div>';
  }

  function staffHome() {
    loading();
    Promise.all([api('listVisitors', 'all'), api('listDisputes')]).then(function (r) {
      var current = r[0].filter(function (v) { return v.status !== 'Left' && v.leaving >= today(); });
      view('<h1>Hello, ' + esc(S.user.name) + '</h1>' +
        '<div class="actions"><a class="btn primary big" href="#visitor-new">Report a visitor</a><a class="btn big" href="#dispute-new">Report a dispute</a></div>' +
        '<section class="card"><h2>Your visitors now</h2>' + (current.length ? visitorTable(current, true) : '<div class="empty">No visitors reported for your quarter right now.</div>') + '</section>' +
        '<section class="card"><h2>Your dispute reports</h2>' + disputeMini(r[1]) + '</section>');

  }

  /* ---------- Visitors ---------- */

  function visitorTable(rows, mine) {
    if (!rows.length) return '<div class="empty">No visitor reports yet.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Arrived</th><th>Quarter</th>' + (mine ? '' : '<th>Staff</th>') +
      '<th>Visitors</th><th>Relation</th><th>Leaving</th><th>Stay</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function (v) {
        return '<tr class="click" data-visitor="' + esc(v.id) + '" tabindex="0"><td class="nw">' + d(v.arrival) + '</td><td class="mono">' + esc(v.quarter) + '</td>' +
          (mine ? '' : '<td>' + esc(v.staffName) + '</td>') +
          '<td>' + esc(v.visitorNames) + ' <span class="muted">(' + esc(v.count) + ')</span></td><td>' + esc(v.relation) + '</td>' +
          '<td class="nw">' + d(v.leaving) + '</td><td style="font-weight:600">' + stayText(v.nights) + '</td><td>' + badge(v.status) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  var visitorCache = {};
  function wireVisitorRows() {
    $$('[data-visitor]').forEach(function (tr) {
      var open = function () { visitorDetail(tr.dataset.visitor); };
      tr.onclick = open;
      tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
    });
  }
  function visitorDetail(id) {
    api('listVisitors', 'all').then(function (rows) {
      var v = rows.filter(function (x) { return x.id === id; })[0];
      if (!v) return;
      var long = Number(v.nights) > S.boot.settings.longStayNights;
      var mineOnly = !isCommittee();
      openDialog('<div class="card-head"><h2>Visitor report</h2>' + badge(v.status) + '</div>' +
        (long ? '<div class="warn">Long stay: more than ' + S.boot.settings.longStayNights + ' nights.</div>' : '') +
        '<dl class="facts"><dt>Staff</dt><dd>' + esc(v.staffName) + '</dd><dt>Quarter</dt><dd>' + esc(v.quarter) + '</dd>' +
        '<dt>Visitors</dt><dd>' + esc(v.visitorNames) + ' (' + esc(v.count) + ')</dd><dt>Relation</dt><dd>' + esc(v.relation) + '</dd>' +
        '<dt>Arrival</dt><dd>' + d(v.arrival) + '</dd><dt>Leaving</dt><dd>' + d(v.leaving) + '</dd><dt>Duration</dt><dd>' + stayText(v.nights) + '</dd>' +
        '<dt>Phone</dt><dd>' + (esc(v.phone) || '—') + '</dd><dt>ID seen</dt><dd>' + (esc(v.idType) || '—') + '</dd>' +
        '<dt>Purpose</dt><dd>' + (esc(v.purpose) || '—') + '</dd>' +
        (v.reviewedBy ? '<dt>Reviewed by</dt><dd>' + esc(v.reviewedBy) + (v.reviewNote ? ': ' + esc(v.reviewNote) : '') + '</dd>' : '') +
        '</dl>' +
        (v.photoId ? '<div><button class="btn sm" type="button" data-photo>See ID photo</button></div>' : '') +
        (mineOnly ? '' : '<div class="field"><label for="rnote">Note (optional)</label><input type="text" id="rnote" placeholder="For example: approved till Sunday"></div>') +
        '<div class="actions">' +
        (mineOnly ? '' : '<button class="btn primary" type="button" data-st="Approved">Approve</button><button class="btn danger" type="button" data-st="Not approved">Not approved</button>') +
        (v.status !== 'Left' ? '<button class="btn" type="button" data-st="Left">Visitor has left</button>' : '') +
        (mineOnly ? (v.status !== 'Left' ? '<a class="btn" href="#visitor-edit/' + esc(v.id) + '" data-edit>Change dates</a>' : '')
          : '<a class="btn" href="#visitor-edit/' + esc(v.id) + '" data-edit>Edit</a><button class="btn ghost danger" type="button" data-delete>Delete</button>') +
        '<button class="btn ghost" type="button" data-close>Close</button></div>', function (root) {
        $('[data-close]', root).onclick = closeDialog;
        var ph = $('[data-photo]', root); if (ph) ph.onclick = function () { showPhotos([v.photoId], 'ID photo'); };
        var ed = $('[data-edit]', root); if (ed) ed.onclick = function () { visitorCache[v.id] = v; closeDialog(); };
        var del = $('[data-delete]', root);
        if (del) del.onclick = function () {
          if (!confirm('Delete this visitor report for ' + v.visitorNames + '? This cannot be undone.')) return;
          busy(del, true, 'Deleting…');
          api('deleteVisitor', v.id).then(function () { closeDialog(); toast('Deleted.'); route(); }).catch(function (e) { busy(del, false); fail(e); });
        };
        $$('[data-st]', root).forEach(function (b) {
          b.onclick = function () {
            busy(b, true);
            api('setVisitorStatus', v.id, b.dataset.st, ($('#rnote', root) || {}).value || '').then(function () {
              closeDialog(); toast('Saved.'); route();
            }).catch(function (e) { busy(b, false); fail(e); });
          };
        });
      });
    }).catch(fail);
  }

  routes.visitors = function (filter) {
    filter = filter || 'staying';
    loading();
    api('listVisitors', filter).then(function (rows) {
      var f = [['staying', 'Staying now'], ['review', 'To review'], ['all', 'All reports']];
      var months = {};
      rows.forEach(function (r) { months[String(r.arrival).slice(0, 7)] = true; });
      view('<div class="card-head"><h1>Visitor reports</h1><a class="btn primary" href="#visitor-new">+ Report a visitor</a></div>' +
        '<div class="toolbar"><div class="chips" role="group" aria-label="Show">' + f.map(function (x) {
          return '<a class="chip' + (x[0] === filter ? ' on' : '') + '" href="#visitors/' + x[0] + '">' + x[1] + '</a>';
        }).join('') + '</div>' +
        '<div class="filters"><input type="search" id="vsearch" placeholder="Search name, quarter or staff" aria-label="Search">' +
        '<select id="vmonth" aria-label="Month"><option value="">Any month</option>' + Object.keys(months).sort().reverse().map(function (m) {
          return '<option value="' + m + '">' + monthName(m) + '</option>';
        }).join('') + '</select></div></div>' +
        '<section class="card"><div class="small muted" id="vcount"></div><div id="vlist"></div></section>');
      setActive('visitors');
      function draw() {
        var q = $('#vsearch').value.trim().toLowerCase(), m = $('#vmonth').value;
        var shown = rows.filter(function (r) {
          if (m && String(r.arrival).slice(0, 7) !== m && String(r.leaving).slice(0, 7) !== m) return false;
          if (!q) return true;
          return [r.visitorNames, r.quarter, r.staffName, r.relation, r.phone, r.purpose].join(' ').toLowerCase().indexOf(q) >= 0;
        });
        $('#vcount').textContent = shown.length + (shown.length === 1 ? ' report' : ' reports') + (q || m ? ' match' : '');
        $('#vlist').innerHTML = visitorTable(shown, false);
        wireVisitorRows();
      }
      $('#vsearch').oninput = draw; $('#vmonth').onchange = draw;
      draw();
    }).catch(fail);
  };
  function monthName(ym) {
    var p = ym.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  }

  var RELATIONS = ['Family', 'Relative', 'Friend', 'Worker or service', 'Other'];
  var ID_TYPES = ['Aadhaar', 'Voter ID', 'Driving licence', 'Passport', 'RC (Registration Certificate)', 'Other', 'Not seen'];

  routes['visitor-edit'] = function (id) {
    var v = visitorCache[id];
    if (!v) { go('home'); return; }
    visitorForm(v);
  };
  routes['visitor-new'] = function () { visitorForm(null); };

  function visitorForm(v) {
    var me = S.user, names = S.boot.knownNames || S.boot.staff;
    var editing = !!v;
    v = v || { arrival: today(), leaving: '', count: '1', relation: '', quarter: isCommittee() ? '' : me.quarter };
    // The committee types any name; names used before are suggested, with their quarter.
    var staffPick = isCommittee()
      ? '<div class="field"><label for="vstaff">Staff member *</label><input type="text" id="vstaff" name="staffName" list="vnames" autocomplete="off" value="' + esc(editing ? v.staffName : '') + '" placeholder="Type the staff member\'s name">' +
        '<datalist id="vnames">' + names.map(function (s) { return '<option value="' + esc(s.name) + '">' + (s.quarter ? 'Quarter ' + esc(s.quarter) : '') + '</option>'; }).join('') + '</datalist></div>'
      : '<div class="field"><span class="lbl">Staff member</span><div class="output">' + esc(editing ? v.staffName : me.name) + '</div></div>';
    var photo = null;
    view('<h1>' + (editing ? (isCommittee() ? 'Edit visitor report' : 'Change visitor dates') : 'Report a visitor') + '</h1>' +
      '<div class="note">Tell the committee when anyone who is not school staff stays in or visits your quarter. Fields marked * are needed.</div>' +
      '<form class="card stack" id="vform" novalidate>' +
      '<div class="grid2">' + staffPick +
      '<div class="field"><label for="vq">Quarter number *</label><input type="text" id="vq" name="quarter" class="mono" value="' + esc(v.quarter) + '" required></div></div>' +
      '<div class="grid2"><div class="field"><label for="vn">Visitor name(s) *</label><input type="text" id="vn" name="visitorNames" value="' + esc(v.visitorNames) + '" placeholder="Full names" required></div>' +
      '<div class="field"><label for="vc">How many people *</label><input type="number" id="vc" name="count" min="1" value="' + esc(v.count) + '" required></div></div>' +
      '<fieldset><legend>Relation to the staff member *</legend><div class="chips">' + RELATIONS.map(function (r) {
        return '<label class="chip"><input type="radio" name="relation" value="' + esc(r) + '"' + (v.relation === r ? ' checked' : '') + '> ' + esc(r) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<div class="grid3"><div class="field"><label for="va">Arrival date *</label><input type="date" id="va" name="arrival" value="' + esc(v.arrival) + '" required></div>' +
      '<div class="field"><label for="vl">Expected to leave *</label><input type="date" id="vl" name="leaving" value="' + esc(v.leaving) + '" required></div>' +
      '<div class="field"><span class="lbl">Duration of stay</span><output class="output" id="vdur" aria-live="polite">—</output></div></div>' +
      '<div id="vlong" class="warn hidden"></div>' +
      '<div class="grid2"><div class="field"><label for="vp">Visitor phone</label><input type="tel" id="vp" name="phone" value="' + esc(v.phone) + '" placeholder="Optional"></div>' +
      '<div class="field"><label for="vi">ID seen</label><select id="vi" name="idType"><option value="">Choose…</option>' + ID_TYPES.map(function (t) {
        return '<option' + (v.idType === t ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select></div></div>' +
      '<div class="field"><label for="vpu">Purpose of visit</label><textarea id="vpu" name="purpose" placeholder="For example: parents visiting for the holidays">' + esc(v.purpose) + '</textarea></div>' +
      (editing ? '' : '<div class="field"><span class="lbl">Photo of ID (optional)</span><div class="photos" id="vphotos"></div>' +
        '<input type="file" id="vfile" accept="image/*" capture="environment" class="hidden"></div>') +
      '<div class="actions"><a class="btn" href="#home">Cancel</a><button class="btn primary big" type="submit">' + (editing ? 'Save changes' : 'Send to committee') + '</button></div>' +
      '</form>');

    var who = $('#vstaff');
    if (who) who.oninput = function () {
      var n = who.value.trim().toLowerCase();
      var hit = names.filter(function (s) { return s.name.toLowerCase() === n; })[0];
      if (hit && hit.quarter) $('#vq').value = hit.quarter;
    };
    function dur() {
      var n = nights($('#va').value, $('#vl').value);
      var out = $('#vdur'), warn = $('#vlong');
      if (n === null) { out.textContent = '—'; warn.classList.add('hidden'); return; }
      if (n < 0) { out.textContent = 'Check the dates'; warn.textContent = 'Leaving date is before the arrival date.'; warn.classList.remove('hidden'); return; }
      out.textContent = stayText(n);
      var lim = S.boot.settings.longStayNights;
      if (n > lim) { warn.textContent = 'This is longer than ' + lim + ' nights. The committee needs to approve long stays.'; warn.classList.remove('hidden'); }
      else warn.classList.add('hidden');
    }
    $('#va').oninput = dur; $('#vl').oninput = dur; dur();

    function drawPhoto() {
      var box = $('#vphotos'); if (!box) return;
      box.innerHTML = (photo ? '<div class="thumb"><img alt="ID photo" src="' + photo + '"><button type="button" aria-label="Remove photo" data-rm>×</button></div>' : '') +
        (photo ? '' : '<button type="button" class="add-photo" data-add>Take photo or choose file</button>');
      var rm = $('[data-rm]', box); if (rm) rm.onclick = function () { photo = null; drawPhoto(); };
      var add = $('[data-add]', box); if (add) add.onclick = function () { $('#vfile').click(); };
    }
    if ($('#vfile')) {
      $('#vfile').onchange = function (e) {
        var f = e.target.files[0]; if (!f) return;
        shrinkImage(f).then(function (u) { photo = u; drawPhoto(); }).catch(fail);
        e.target.value = '';
      };
      drawPhoto();
    }

    $('#vform').onsubmit = function (e) {
      e.preventDefault();
      var data = formData(e.target);
      if (isCommittee() && !String(data.staffName || '').trim()) return fail(new Error('Type the name of the staff member.'));
      if (!data.visitorNames || !data.relation || !data.arrival || !data.leaving) return fail(new Error('Please fill in the fields marked *.'));
      if (editing) {
        data.id = v.id;
        if (isCommittee() && data.staffName.trim().toLowerCase() === String(v.staffName).toLowerCase()) data.staffId = v.staffId;
      }
      if (photo) data.photo = photo;
      var btn = $('button[type=submit]', e.target); busy(btn, true, 'Sending…');
      api('saveVisitor', data).then(function () {
        toast(editing ? 'Saved.' : isCommittee() ? 'Visitor report saved.' : 'Sent. The committee will review it.');
        refreshBoot();
        go(isCommittee() ? 'visitors' : 'home');
      }).catch(function (err) { busy(btn, false); fail(err); });
    };
  }

  /* ---------- Disputes ---------- */

  var KINDS = ['Noise', 'Shared space', 'Water or electricity', 'Children', 'Words or behaviour', 'Other'];
  var WISHES = ['Just keep a record', 'Talk to them', 'Hold a meeting'];

  routes['dispute-new'] = function () {
    var involved = [];
    view('<h1>Report a dispute</h1>' +
      '<div class="note"><strong style="color:var(--ink)">Private to the committee.</strong> Only SWC committee members can read this report. The people named will not see who sent it.</div>' +
      '<form class="card stack" id="dform" novalidate>' +
      '<label class="check"><input type="checkbox" name="anonymous"> Send without my name (anonymous)</label>' +
      '<div class="field"><label for="dwho">Who is involved *</label>' +
      '<div class="actions" style="flex-wrap:nowrap"><input type="text" id="dwho" list="staffNames" placeholder="Type a name, then Add"><button class="btn" type="button" id="dadd">Add</button></div>' +
      '<datalist id="staffNames">' + S.boot.staff.map(function (s) { return '<option value="' + esc(s.name) + '">'; }).join('') + '</datalist>' +
      '<div class="chips" id="dtags"></div></div>' +
      '<fieldset><legend>What is it about *</legend><div class="chips">' + KINDS.map(function (k) {
        return '<label class="chip"><input type="radio" name="kind" value="' + esc(k) + '"> ' + esc(k) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<div class="grid2"><div class="field"><label for="dwhen">When did it happen *</label><input type="date" id="dwhen" name="happenedOn" value="' + today() + '"></div>' +
      '<div class="field"><label for="dwhere">Where</label><input type="text" id="dwhere" name="place" placeholder="For example: Block B corridor"></div></div>' +
      '<div class="field"><label for="dwhat">What happened *</label><textarea id="dwhat" name="details" rows="5" placeholder="Describe what happened, in your own words."></textarea></div>' +
      '<fieldset><legend>What would you like the committee to do</legend><div class="chips">' + WISHES.map(function (k) {
        return '<label class="chip"><input type="radio" name="wish" value="' + esc(k) + '"> ' + esc(k) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<div class="actions"><a class="btn" href="#home">Cancel</a><button class="btn primary big" type="submit">Send privately to committee</button></div></form>');
    function drawTags() {
      $('#dtags').innerHTML = involved.map(function (n, i) { return '<span class="tag">' + esc(n) + '<button type="button" aria-label="Remove ' + esc(n) + '" data-i="' + i + '">×</button></span>'; }).join('');
      $$('#dtags [data-i]').forEach(function (b) { b.onclick = function () { involved.splice(Number(b.dataset.i), 1); drawTags(); }; });
    }
    function addWho() { var n = $('#dwho').value.trim(); if (n && involved.indexOf(n) < 0) involved.push(n); $('#dwho').value = ''; drawTags(); }
    $('#dadd').onclick = addWho;
    $('#dwho').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); addWho(); } };
    $('#dform').onsubmit = function (e) {
      e.preventDefault();
      if ($('#dwho').value.trim()) addWho();
      var data = formData(e.target);
      data.involved = involved.join(', ');
      if (!data.involved || !data.kind || !data.happenedOn || !data.details) return fail(new Error('Please fill in the fields marked *.'));
      var btn = $('button[type=submit]', e.target); busy(btn, true, 'Sending…');
      api('saveDispute', data).then(function (r) {
        toast('Sent privately. Case ' + r.caseNo + '.');
        go(isCommittee() ? 'disputes' : 'mine');
      }).catch(function (err) { busy(btn, false); fail(err); });
    };
  };

  function disputeMini(rows) {
    if (!rows.length) return '<div class="empty">You have not sent any dispute reports. Anonymous reports are not listed here.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Case</th><th>About</th><th>Sent</th><th>Status</th><th>Meeting</th></tr></thead><tbody>' +
      rows.map(function (c) {
        return '<tr><td class="mono">' + esc(c.caseNo) + '</td><td>' + esc(c.kind) + '</td><td class="nw">' + d(c.createdAt) + '</td><td>' + badge(c.status) + '</td><td class="nw">' + (d(c.meetingDate) || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  routes.disputes = function () {
    loading();
    api('listDisputes').then(function (rows) {
      view('<div class="card-head"><h1>Disputes</h1><a class="btn primary" href="#dispute-new">Report a dispute</a></div>' +
        '<div class="note">Committee only. Open a case to see the people involved and the full report.</div>' +
        '<section class="card">' + (rows.length ? '<div class="table-wrap"><table><thead><tr><th>Case</th><th>About</th><th>Where</th><th>Happened</th><th>Status</th><th>Meeting</th></tr></thead><tbody>' +
        rows.map(function (c) {

      $$('[data-case]').forEach(function (tr) {

    api('listEvents').then(function (x) {
      view('<h1>Party funds</h1>' +
        '<div class="tiles">' + tile('Collected, all events', rs(x.collected), 'donations') + tile('Spent, all events', rs(x.spent), 'expenses') +

      }).join('') + '</div>' +

  function calcEval(expr) {
    var parts = expr.match(/(\d+\.?\d*|\.\d+|[+−×÷])/g) || [];
    var nums = [], ops = [];
    parts.forEach(function (p) { if (/[+−×÷]/.test(p)) ops.push(p); else nums.push(parseFloat(p)); });
    if (!nums.length) return 0;
    ops = ops.slice(0, nums.length - 1);
    var n2 = [nums[0]], o2 = [];
    for (var j = 0; j < ops.length; j++) {
      if (ops[j] === '×') n2[n2.length - 1] *= nums[j + 1];
      else if (ops[j] === '÷') n2[n2.length - 1] = nums[j + 1] === 0 ? NaN : n2[n2.length - 1] / nums[j + 1];
      else { o2.push(ops[j]); n2.push(nums[j + 1]); }
    }
    var r = n2[0];
    for (var k = 0; k < o2.length; k++) r = o2[k] === '+' ? r + n2[k + 1] : r - n2[k + 1];
    return Math.round(r * 100) / 100;
  }

  function wireCalculator(onUse) {
    var expr = '', result = 0, done = false;
    function draw() {
      $('#cexpr').textContent = done ? expr + ' =' : '';
      $('#cres').textContent = done ? (isFinite(result) ? num(result) : 'Error') : (expr || '0');
    }
    function press(k) {
      if (k === 'C') { expr = ''; result = 0; done = false; }
      else if (k === 'back') { if (done) { expr = ''; done = false; } else expr = expr.slice(0, -1); }
      else if (k === '=') { if (expr) { result = calcEval(expr); done = true; } }
      else {
        var isOp = /[+−×÷]/.test(k);
        if (done) { expr = isOp && isFinite(result) ? String(result) : ''; done = false; }
        if (isOp) { if (!expr) return draw(); expr = expr.replace(/[+−×÷]$/, ''); }
        if (k === '.' && /\d*\.\d*$/.test(expr.split(/[+−×÷]/).pop()) && expr.split(/[+−×÷]/).pop().indexOf('.') >= 0) return draw();
        expr += k;
      }
      draw();
    }
    $$('.keys button').forEach(function (b) {
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });
      b.onclick = function () { press(b.dataset.key); };
    });
    var use = $('#cuse');
    use.addEventListener('mousedown', function (e) { e.preventDefault(); });
    use.onclick = function () {
      var v = done ? result : (expr ? calcEval(expr) : 0);
      if (!isFinite(v)) return;
      onUse(String(v));
    };
    draw();
  }

    $('#rprint').onclick = function () { show().then(function (ok) { if (ok) window.print(); }); };
    var pdf = $('#rpdf');
    if (pdf) pdf.onclick = function () {
      show().then(function (ok) {
        if (ok) window.swcDesktop.action('pdf', REPORTS.filter(function (x) { return x[0] === kind; })[0][1] + ' ' + d(reportRange.from) + ' to ' + d(reportRange.to));
      });
    };
    show();
  };

  function reportHead(title, r) {
    return '<header class="report-head">' + sealHtml('report-seal') + '<div><div class="report-org">' + esc(BRAND.committeeName) + ', ' + esc(BRAND.schoolName) + '</div>' +
      '<h1>' + esc(title) + '</h1><div class="muted">' + d(r.from) + ' to ' + d(r.to) + ' · printed ' + d(r.today) + '</div></div></header>';
  }
  function sumTable(rows) {
    return '<div class="report-sum">' + rows.map(function (x) {
      return '<div><div class="small muted">' + esc(x[0]) + '</div><div class="report-num' + (x[2] ? ' ' + x[2] : '') + '">' + esc(x[1]) + '</div></div>';
    }).join('') + '</div>';
  }
  function signLines() {
    return '<div class="sign"><div>Prepared by (Secretary)</div><div>Checked by (Treasurer)</div><div>Approved by (President)</div></div>';
  }

  function visitorReport(r) {
    var v = r.visitors;
    var people = v.reduce(function (n, x) { return n + Number(x.count || 1); }, 0);
    var nightsTotal = v.reduce(function (n, x) { return n + Number(x.nights || 0); }, 0);
    var quarters = {}; v.forEach(function (x) { quarters[x.quarter] = true; });
    var long = v.filter(function (x) { return Number(x.nights) > S.boot.settings.longStayNights; }).length;
    return sumTable([['Visitor reports', v.length], ['People', people], ['Quarters', Object.keys(quarters).length], ['Nights in total', nightsTotal],
      ['Long stays (over ' + S.boot.settings.longStayNights + ' nights)', long]]) +
      (v.length ? '<table class="report-table"><thead><tr><th>#</th><th>Arrived</th><th>Left / leaving</th><th>Stay</th><th>Quarter</th><th>Staff</th><th>Visitors</th><th>Relation</th><th>ID seen</th><th>Status</th></tr></thead><tbody>' +
        v.map(function (x, i) {
          return '<tr><td>' + (i + 1) + '</td><td class="nw">' + d(x.arrival) + '</td><td class="nw">' + d(x.leaving) + '</td><td>' + stayText(x.nights) + '</td><td class="mono">' + esc(x.quarter) + '</td>' +
            '<td>' + esc(x.staffName) + '</td><td>' + esc(x.visitorNames) + ' (' + esc(x.count) + ')' + (x.phone ? '<div class="small muted">' + esc(x.phone) + '</div>' : '') + '</td>' +
            '<td>' + esc(x.relation) + '</td><td>' + (esc(x.idType) || '—') + '</td><td>' + esc(x.status) + '</td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty">No visitors in these dates.</div>') + signLines();
  }

  function disputeReport(r) {
    var c = r.disputes;
    var count = function (st) { return c.filter(function (x) { return x.status === st; }).length; };
    return '<div class="report-note">Confidential: for the Staff Welfare Committee only.</div>' +
      sumTable([['Cases', c.length], ['Open', count('Open')], ['Meeting set', count('Meeting set')], ['Resolved', count('Resolved')], ['Closed', count('Closed')]]) +
      (c.length ? '<table class="report-table"><thead><tr><th>Case</th><th>Happened</th><th>About</th><th>People involved</th><th>Where</th><th>Reporter wants</th><th>Status</th><th>Meeting</th></tr></thead><tbody>' +
        c.map(function (x) {
          return '<tr><td class="mono">' + esc(x.caseNo) + '</td><td class="nw">' + d(x.happenedOn) + '</td><td>' + esc(x.kind) + '</td><td>' + esc(x.involved) + '</td>' +
            '<td>' + (esc(x.place) || '—') + '</td><td>' + (esc(x.wish) || '—') + '</td><td>' + esc(x.status) + '</td><td class="nw">' + (d(x.meetingDate) || '—') + '</td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty">No dispute cases in these dates.</div>') + signLines();
  }

  function moneyReport(r) {
    var inSum = r.donations.reduce(function (n, x) { return n + Number(x.amount); }, 0);
    var outSum = r.expenses.reduce(function (n, x) { return n + Number(x.total); }, 0);
    var byEvent = {}, byCat = {};
    r.donations.forEach(function (x) { var k = x.event || 'No event'; byEvent[k] = byEvent[k] || [0, 0]; byEvent[k][0] += Number(x.amount); });
    r.expenses.forEach(function (x) {
      var k = x.event || 'No event'; byEvent[k] = byEvent[k] || [0, 0]; byEvent[k][1] += Number(x.total);
      byCat[x.category] = (byCat[x.category] || 0) + Number(x.total);
    });
    var bal = inSum - outSum;
    return sumTable([['Collected', rs(inSum)], ['Spent', rs(outSum)], ['Balance for these dates', rs(bal), bal < 0 ? 'neg' : 'pos'],
      ['Expenses without a bill photo', r.expenses.filter(function (x) { return !x.bills; }).length]]) +
      '<h2>By event</h2>' + (Object.keys(byEvent).length ? '<table class="report-table"><thead><tr><th>Event</th><th class="num">Collected</th><th class="num">Spent</th><th class="num">Balance</th></tr></thead><tbody>' +
        Object.keys(byEvent).sort().map(function (k) {
          var e = byEvent[k];
          return '<tr><td>' + esc(k) + '</td><td class="num">' + num(e[0]) + '</td><td class="num">' + num(e[1]) + '</td><td class="num">' + num(e[0] - e[1]) + '</td></tr>';
        }).join('') + '<tr class="total-row"><td>Total</td><td class="num">' + num(inSum) + '</td><td class="num">' + num(outSum) + '</td><td class="num">' + num(bal) + '</td></tr></tbody></table>'
        : '<div class="empty">No money entries in these dates.</div>') +
      (Object.keys(byCat).length ? '<h2>Spending by category</h2><table class="report-table"><thead><tr><th>Category</th><th class="num">Spent</th><th class="num">Share</th></tr></thead><tbody>' +
        Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).map(function (k) {
          return '<tr><td>' + esc(k) + '</td><td class="num">' + num(byCat[k]) + '</td><td class="num">' + (outSum ? Math.round(byCat[k] / outSum * 100) : 0) + '%</td></tr>';
        }).join('') + '</tbody></table>' : '') +
      '<h2>Donations</h2>' + (r.donations.length ? '<table class="report-table"><thead><tr><th>Date</th><th>From</th><th>Event</th><th>Mode</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>' +
        r.donations.map(function (x) {
          return '<tr><td class="nw">' + d(x.date) + '</td><td>' + esc(x.donor) + '</td><td>' + esc(x.event) + '</td><td>' + esc(x.mode) + '</td><td>' + esc(x.note) + '</td><td class="num">' + num(x.amount) + '</td></tr>';
        }).join('') + '<tr class="total-row"><td colspan="5">Total collected</td><td class="num">' + num(inSum) + '</td></tr></tbody></table>' : '<div class="empty">No donations.</div>') +
      '<h2>Expenses</h2>' + (r.expenses.length ? '<table class="report-table"><thead><tr><th>Date</th><th>Category</th><th>Items</th><th>Event</th><th>Paid by</th><th>Bill</th><th class="num">Amount</th></tr></thead><tbody>' +
        r.expenses.map(function (x) {
          return '<tr><td class="nw">' + d(x.date) + '</td><td>' + esc(x.category) + (x.description ? '<div class="small muted">' + esc(x.description) + '</div>' : '') + '</td>' +
            '<td class="small">' + x.items.map(function (it) { return esc(it.item) + ' ' + esc(it.qty) + esc(it.unit ? ' ' + it.unit : '') + ' × ' + num(it.rate); }).join('<br>') + '</td>' +
            '<td>' + esc(x.event) + '</td><td>' + esc(x.paidBy) + '</td><td>' + (x.bills ? 'Yes' : '<strong>No</strong>') + '</td><td class="num">' + num(x.total) + '</td></tr>';
        }).join('') + '<tr class="total-row"><td colspan="6">Total spent</td><td class="num">' + num(outSum) + '</td></tr></tbody></table>' : '<div class="empty">No expenses.</div>') +
      signLines();
  }

  /* ---------- Change PIN ---------- */

  routes.pin = function () {
    view('<h1>Change PIN</h1>' + (S.user.mustChange ? '<div class="warn">You are using a PIN given by the committee. Choose your own PIN to continue.</div>' : '') +
      '<form class="card stack" id="pform" style="max-width:440px" novalidate>' +
      '<div class="field"><label for="p0">Current PIN</label><input type="password" id="p0" inputmode="numeric" autocomplete="current-password"></div>' +
      '<div class="field"><label for="p1">New PIN (4 to 8 digits)</label><input type="password" id="p1" inputmode="numeric" autocomplete="new-password"></div>' +
      '<div class="field"><label for="p2">New PIN again</label><input type="password" id="p2" inputmode="numeric" autocomplete="new-password"></div>' +
      '<div class="actions"><button class="btn primary" type="submit">Save new PIN</button></div></form>');
    $('#pform').onsubmit = function (e) {
      e.preventDefault();
      if ($('#p1').value !== $('#p2').value) return fail(new Error('The two new PINs are not the same.'));
      var btn = $('button[type=submit]', e.target); busy(btn, true);
      api('changePin', $('#p0').value, $('#p1').value).then(function () {
        S.user.mustChange = false; toast('PIN changed.'); go('home');
      }).catch(function (err) { busy(btn, false); fail(err); });
    };
  };

  /* ---------- Staff and settings (admin) ---------- */

  routes.staff = function () {
    if (!isAdmin()) return go('home');
    loading();
    api('listStaff').then(function (list) {
      var st = S.boot.settings;
      view('<h1>Staff and settings</h1>' +
        '<section class="card"><h2>Add a staff member</h2><form class="stack" id="sform" novalidate><div class="grid2">' +
        '<div class="field"><label for="si">Staff ID *</label><input type="text" id="si" name="id" placeholder="For example: tenzin.d" autocapitalize="none"></div>' +
        '<div class="field"><label for="sn">Full name *</label><input type="text" id="sn" name="name"></div>' +
        '<div class="field"><label for="sq">Quarter number</label><input type="text" id="sq" name="quarter" class="mono"></div>' +
        '<div class="field"><label for="sr">Role</label><select id="sr" name="role"><option value="staff">Staff</option><option value="committee">Committee member</option><option value="admin">Admin</option></select></div></div>' +
        '<div class="actions"><button class="btn primary" type="submit">Add and make a PIN</button></div></form></section>' +
        '<section class="card"><h2>Everyone</h2><div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Name</th><th>Quarter</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>' +
        list.map(function (s) {
          return '<tr data-sid="' + esc(s.id) + '"><td class="mono">' + esc(s.id) + '</td><td><input type="text" data-f="name" value="' + esc(s.name) + '" aria-label="Name"></td>' +
            '<td><input type="text" data-f="quarter" class="mono" value="' + esc(s.quarter) + '" aria-label="Quarter" style="width:90px"></td>' +
            '<td><select data-f="role" aria-label="Role">' + [['staff', 'Staff'], ['committee', 'Committee'], ['admin', 'Admin']].map(function (r) {
              return '<option value="' + r[0] + '"' + (s.role === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
            }).join('') + '</select></td>' +
            '<td><select data-f="active" aria-label="Active"><option value="yes"' + (s.active === 'yes' ? ' selected' : '') + '>Yes</option><option value="no"' + (s.active !== 'yes' ? ' selected' : '') + '>No</option></select></td>' +
            '<td style="white-space:nowrap"><button class="btn sm" type="button" data-save>Save</button> <button class="btn sm ghost" type="button" data-reset>New PIN</button></td></tr>';
        }).join('') + '</tbody></table></div></section>' +
        '<section class="card"><h2>Name and logo</h2><form class="stack" id="brandform" novalidate>' +
        '<div class="grid2"><div class="field"><label for="bcn">Committee name</label><input type="text" id="bcn" value="' + esc(BRAND.committeeName) + '"></div>' +
        '<div class="field"><label for="bsn">School name</label><input type="text" id="bsn" value="' + esc(BRAND.schoolName) + '"></div></div>' +
        '<div class="field"><span class="lbl">Logo (shown in the header, on the sign-in screen and on printed reports)</span>' +
        '<div class="actions"><div class="logo-preview" id="blogo"></div><button class="btn sm" type="button" id="blogoPick">Choose picture</button>' +
        '<button class="btn sm ghost danger" type="button" id="blogoRm">Remove logo</button><input type="file" id="blogoFile" accept="image/*" class="hidden"></div></div>' +
        '<div class="actions"><button class="btn primary" type="submit">Save name and logo</button></div></form></section>' +
        '<section class="card"><h2>Settings</h2><form class="stack" id="setform" novalidate>' +
        '<div class="field" style="max-width:300px"><label for="ln">Long stay: warn after how many nights</label><input type="number" id="ln" name="longStayNights" min="1" value="' + esc(st.longStayNights) + '"></div>' +
        '<div class="field"><label for="cats">Expense categories (one per line)</label><textarea id="cats" rows="6">' + esc(st.expenseCategories.join('\n')) + '</textarea></div>' +
        '<div class="actions"><button class="btn primary" type="submit">Save settings</button></div></form></section>' +
        (DESKTOP ? '<section class="card"><h2>This PC</h2><div id="deskinfo" class="small muted">Loading…</div>' +
          '<div class="actions"><button class="btn sm" type="button" data-backup>Back up now</button>' +
          '<button class="btn sm" type="button" id="dupdate">Install update from zip file…</button></div></section>' : ''));
      if (DESKTOP) {
        desktopInfo().then(function (info) {
          if (info) $('#deskinfo').textContent = 'App version ' + info.version + '. ' + backupText(info) + ' Records are kept in ' + info.dataDir + '.';
        });
        wireBackupButtons($('#view'));
        $('#dupdate').onclick = function () { window.swcDesktop.action('update'); };
      }

      function pinDialog(name, id, pin) {
        openDialog('<h2>PIN for ' + esc(name) + '</h2><p style="margin:0">Give these to ' + esc(name) + '. They will be asked to choose their own PIN when they first sign in.</p>' +
          '<dl class="facts"><dt>Staff ID</dt><dd class="mono">' + esc(id) + '</dd><dt>PIN</dt><dd class="mono" style="font-size:24px">' + esc(pin) + '</dd></dl>' +
          '<div class="small muted">This PIN is shown only once.</div><div class="actions"><button class="btn primary" type="button" data-close>Done</button></div>', function (root) {
          $('[data-close]', root).onclick = function () { closeDialog(); route(); };
        });
      }
      $('#sform').onsubmit = function (e) {
        e.preventDefault();
        var data = formData(e.target);
        api('saveStaff', data).then(function (r) { refreshBoot(); pinDialog(r.user.name, r.user.id, r.pin); }).catch(fail);
      };
      $$('[data-sid]').forEach(function (tr) {
        var id = tr.dataset.sid;
        $('[data-save]', tr).onclick = function () {
          var data = { id: id, editing: true };
          $$('[data-f]', tr).forEach(function (el) { data[el.dataset.f] = el.value; });
          api('saveStaff', data).then(function () { toast('Saved.'); refreshBoot(); }).catch(fail);
        };
        $('[data-reset]', tr).onclick = function () {
          if (!confirm('Make a new PIN for ' + id + '? Their old PIN will stop working.')) return;
          api('resetPin', id).then(function (r) { pinDialog($('[data-f=name]', tr).value, id, r.pin); }).catch(fail);
        };
      });
      var logo = BRAND.logo;
      function drawLogo() { $('#blogo').innerHTML = logo ? '<img alt="Logo" src="' + esc(logo) + '">' : '<span class="small muted">No logo: the round SWC seal is used.</span>'; }
      drawLogo();
      $('#blogoPick').onclick = function () { $('#blogoFile').click(); };
      $('#blogoRm').onclick = function () { logo = ''; drawLogo(); };
      $('#blogoFile').onchange = function (ev) {
        var f = ev.target.files[0]; if (!f) return;
        logoImage(f).then(function (u) { logo = u; drawLogo(); }).catch(fail);
        ev.target.value = '';
      };
      $('#brandform').onsubmit = function (ev) {
        ev.preventDefault();
        var btn = $('button[type=submit]', ev.target); busy(btn, true);
        api('saveSettings', { committeeName: $('#bcn').value, schoolName: $('#bsn').value, logo: logo }).then(function () {
          return call('branding');
        }).then(function (b) { busy(btn, false); applyBrand(b); toast('Saved.'); }).catch(function (err) { busy(btn, false); fail(err); });
      };
      $('#setform').onsubmit = function (e) {
        e.preventDefault();
        api('saveSettings', { longStayNights: $('#ln').value, expenseCategories: $('#cats').value.split('\n') }).then(function (s) {
          S.boot.settings = s; toast('Settings saved.');
        }).catch(fail);
      };
    }).catch(fail);
  };
  function refreshBoot() { call('bootstrap', S.token).then(function (b) { S.boot = b; }).catch(function () {}); }

  /* ---------- Go ---------- */

  call('branding').then(applyBrand).catch(function () {});
  if (S.token) start(); else showLogin();
})();
</script>
